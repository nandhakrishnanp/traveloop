openapi: 3.0.3
info:
  title: GlobeTrotter API
  description: |
    Travel planning platform API for creating multi-city itineraries, managing activities, and tracking budgets.
    
    Built with Go Gin framework and PostgreSQL with sqlc.
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:8080/v1
    description: Development server

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Authentication and user management
  - name: Trips
    description: Trip creation and management
  - name: Stops
    description: Trip stops (cities in itinerary)
  - name: Activities
    description: Activities and trip activities
  - name: Expenses
    description: Budget and expense tracking
  - name: Cities
    description: City search and discovery
  - name: Dashboard
    description: User dashboard and statistics

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                full_name:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already exists

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/profile:
    get:
      tags: [Auth]
      summary: Get current user profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    
    patch:
      tags: [Auth]
      summary: Update user profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                profile_photo_url:
                  type: string
                language_preference:
                  type: string
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /trips:
    get:
      tags: [Trips]
      summary: Get user's trips
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of trips
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TripResponse'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
    
    post:
      tags: [Trips]
      summary: Create new trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'

  /trips/{tripId}:
    get:
      tags: [Trips]
      summary: Get trip details
      parameters:
        - $ref: '#/components/parameters/tripId'
      responses:
        '200':
          description: Trip details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    
    patch:
      tags: [Trips]
      summary: Update trip
      parameters:
        - $ref: '#/components/parameters/tripId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripRequest'
      responses:
        '200':
          description: Trip updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
    
    delete:
      tags: [Trips]
      summary: Delete trip
      parameters:
        - $ref: '#/components/parameters/tripId'
      responses:
        '204':
          description: Trip deleted

  /trips/{tripId}/itinerary:
    get:
      tags: [Trips]
      summary: Get full trip itinerary
      description: Returns complete trip with stops, activities, and day-by-day breakdown
      parameters:
        - $ref: '#/components/parameters/tripId'
      responses:
        '200':
          description: Full itinerary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryResponse'

  /trips/{tripId}/budget:
    get:
      tags: [Expenses]
      summary: Get trip budget summary
      parameters:
        - $ref: '#/components/parameters/tripId'
      responses:
        '200':
          description: Budget breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetSummaryResponse'

  /trips/{tripId}/stops:
    get:
      tags: [Stops]
      summary: Get trip stops
      parameters:
        - $ref: '#/components/parameters/tripId'
      responses:
        '200':
          description: List of stops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripStopResponse'
    
    post:
      tags: [Stops]
      summary: Add stop to trip
      parameters:
        - $ref: '#/components/parameters/tripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripStopRequest'
      responses:
        '201':
          description: Stop added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripStopResponse'

  /stops/{stopId}:
    get:
      tags: [Stops]
      summary: Get stop details
      parameters:
        - name: stopId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stop details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripStopResponse'
    
    patch:
      tags: [Stops]
      summary: Update stop
      parameters:
        - name: stopId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripStopRequest'
      responses:
        '200':
          description: Stop updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripStopResponse'
    
    delete:
      tags: [Stops]
      summary: Delete stop
      parameters:
        - name: stopId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Stop deleted

  /stops/{stopId}/activities:
    get:
      tags: [Activities]
      summary: Get activities for a stop
      parameters:
        - name: stopId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripActivityResponse'
    
    post:
      tags: [Activities]
      summary: Add activity to stop
      parameters:
        - name: stopId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripActivityRequest'
      responses:
        '201':
          description: Activity added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripActivityResponse'

  /trip-activities/{activityId}:
    patch:
      tags: [Activities]
      summary: Update trip activity
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripActivityRequest'
      responses:
        '200':
          description: Activity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripActivityResponse'
    
    delete:
      tags: [Activities]
      summary: Remove activity from trip
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Activity removed

  /cities/search:
    get:
      tags: [Cities]
      summary: Search cities
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CityResponse'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

  /cities/{cityId}:
    get:
      tags: [Cities]
      summary: Get city details
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: City details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityResponse'

  /cities/{cityId}/activities:
    get:
      tags: [Activities]
      summary: Get activities in a city
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityResponse'

  /trips/{tripId}/expenses:
    get:
      tags: [Expenses]
      summary: Get trip expenses
      parameters:
        - $ref: '#/components/parameters/tripId'
        - name: type
          in: query
          schema:
            type: string
            enum: [transport, accommodation, meals, other]
      responses:
        '200':
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseResponse'
    
    post:
      tags: [Expenses]
      summary: Add expense to trip
      parameters:
        - $ref: '#/components/parameters/tripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
      responses:
        '201':
          description: Expense added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Get user dashboard
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'

  /public/trips/{slug}:
    get:
      tags: [Trips]
      summary: Get public trip by slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public trip details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    tripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        profile_photo_url:
          type: string
          nullable: true
        language_preference:
          type: string
        created_at:
          type: string
          format: date-time

    CreateTripRequest:
      type: object
      required: [name, start_date, end_date]
      properties:
        name:
          type: string
        description:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        cover_photo_url:
          type: string
        is_public:
          type: boolean
          default: false
        public_slug:
          type: string

    UpdateTripRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        cover_photo_url:
          type: string
        is_public:
          type: boolean
        public_slug:
          type: string

    TripResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        cover_photo_url:
          type: string
        is_public:
          type: boolean
        public_slug:
          type: string
        stops_count:
          type: integer
        total_budget:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTripStopRequest:
      type: object
      required: [city_id, arrival_date, departure_date, stop_order]
      properties:
        city_id:
          type: string
          format: uuid
        arrival_date:
          type: string
          format: date
        departure_date:
          type: string
          format: date
        stop_order:
          type: integer
        notes:
          type: string

    UpdateTripStopRequest:
      type: object
      properties:
        arrival_date:
          type: string
          format: date
        departure_date:
          type: string
          format: date
        stop_order:
          type: integer
        notes:
          type: string

    TripStopResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        city_id:
          type: string
          format: uuid
        city_name:
          type: string
        country:
          type: string
        cost_index:
          type: number
        city_image:
          type: string
        arrival_date:
          type: string
          format: date
        departure_date:
          type: string
          format: date
        stop_order:
          type: integer
        notes:
          type: string
        created_at:
          type: string
          format: date-time

    CreateTripActivityRequest:
      type: object
      required: [activity_id, scheduled_date]
      properties:
        activity_id:
          type: string
          format: uuid
        scheduled_date:
          type: string
          format: date
        scheduled_time:
          type: string
          format: time
        actual_cost:
          type: number
          format: double
        notes:
          type: string
        activity_order:
          type: integer
          default: 0

    UpdateTripActivityRequest:
      type: object
      properties:
        scheduled_date:
          type: string
          format: date
        scheduled_time:
          type: string
          format: time
        actual_cost:
          type: number
          format: double
        notes:
          type: string
        activity_order:
          type: integer

    TripActivityResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trip_stop_id:
          type: string
          format: uuid
        activity_id:
          type: string
          format: uuid
        activity_name:
          type: string
        description:
          type: string
        category:
          type: string
        estimated_cost:
          type: number
        actual_cost:
          type: number
        duration_minutes:
          type: integer
        scheduled_date:
          type: string
          format: date
        scheduled_time:
          type: string
          format: time
        activity_order:
          type: integer
        notes:
          type: string
        image_url:
          type: string
        created_at:
          type: string
          format: date-time

    ActivityResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        city_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        category:
          type: string
        estimated_cost:
          type: number
        duration_minutes:
          type: integer
        image_url:
          type: string
        created_at:
          type: string
          format: date-time

    CreateExpenseRequest:
      type: object
      required: [expense_type, amount]
      properties:
        trip_stop_id:
          type: string
          format: uuid
        expense_type:
          type: string
          enum: [transport, accommodation, meals, other]
        amount:
          type: number
          format: double
        currency:
          type: string
          default: USD
        expense_date:
          type: string
          format: date
        description:
          type: string

    ExpenseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        trip_stop_id:
          type: string
          format: uuid
        expense_type:
          type: string
        amount:
          type: number
        currency:
          type: string
        expense_date:
          type: string
          format: date
        description:
          type: string
        created_at:
          type: string
          format: date-time

    BudgetSummaryResponse:
      type: object
      properties:
        trip_id:
          type: string
          format: uuid
        transport_total:
          type: number
        accommodation_total:
          type: number
        meals_total:
          type: number
        other_total:
          type: number
        activities_total:
          type: number
        total_expenses:
          type: number
        grand_total:
          type: number
        currency:
          type: string

    CityResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        country:
          type: string
        region:
          type: string
        cost_index:
          type: number
        popularity_score:
          type: integer
        latitude:
          type: number
        longitude:
          type: number
        description:
          type: string
        image_url:
          type: string
        created_at:
          type: string
          format: date-time

    DashboardResponse:
      type: object
      properties:
        upcoming_trips:
          type: array
          items:
            $ref: '#/components/schemas/TripResponse'
        recent_trips:
          type: array
          items:
            $ref: '#/components/schemas/TripResponse'
        popular_cities:
          type: array
          items:
            $ref: '#/components/schemas/CityResponse'
        saved_destinations:
          type: array
          items:
            $ref: '#/components/schemas/CityResponse'
        total_trips_count:
          type: integer

    ItineraryDayView:
      type: object
      properties:
        date:
          type: string
          format: date
        city_name:
          type: string
        city_id:
          type: string
          format: uuid
        activities:
          type: array
          items:
            $ref: '#/components/schemas/TripActivityResponse'
        day_cost:
          type: number

    ItineraryResponse:
      type: object
      properties:
        trip:
          $ref: '#/components/schemas/TripResponse'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/TripStopResponse'
        day_by_day:
          type: array
          items:
            $ref: '#/components/schemas/ItineraryDayView'
        total_cost:
          type: number
        total_days:
          type: integer

    PaginationMeta:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
